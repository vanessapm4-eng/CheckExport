<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CheckExport{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --verde: #0d4f32;
      --verde-mid: #1a7a4e;
      --verde-light: #e8f5ef;
      --amber: #e8a020;
      --amber-light: #fef3dc;
      --bg: #f4f6f3;
      --border: #dde3da;
      --text: #1a1f18;
      --text-mid: #4a5248;
      --text-light: #8a9088;
    }
    * { font-family: 'DM Sans', sans-serif; }
    h1,h2,h3,h4,h5,h6,.navbar-brand { font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); }

    .navbar {
      background: var(--verde) !important;
      padding: 0.75rem 2rem;
      box-shadow: 0 2px 12px rgba(13,79,50,0.15);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.3px;
      color: white !important;
    }
    .navbar-brand span { color: #6fcfa0; }
    .nav-user {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      margin-right: 1rem;
    }
    .btn-salir {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-size: 0.82rem;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn-salir:hover { background: rgba(255,255,255,0.2); color: white; }

    .page-wrap { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .card {
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06) !important;
    }
    .card-header {
      background: white !important;
      border-bottom: 1px solid var(--border) !important;
      border-radius: 12px 12px 0 0 !important;
    }

    .badge-verde { background: var(--verde-light); color: var(--verde-mid); font-weight: 500; border: 1px solid #b8ddc9; }
    .badge-amber { background: var(--amber-light); color: #a06010; font-weight: 500; border: 1px solid #f0d090; }
    .badge-rojo { background: #fdecea; color: #c0392b; font-weight: 500; border: 1px solid #f5b8b2; }

    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    .toast-check {
      background: var(--verde);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(13,79,50,0.3);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="bi bi-flower1 me-2"></i>Check<span>Export</span>
    </a>
    <div class="ms-auto d-flex align-items-center">
      <span class="nav-user"><i class="bi bi-person-circle me-1"></i>{{ request.user.get_full_name|default:request.user.username }}</span>
      <a href="/usuarios/logout/" class="btn-salir text-decoration-none">
        <i class="bi bi-box-arrow-right me-1"></i>Salir
      </a>
    </div>
  </div>
</nav>

<div class="page-wrap">
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-success alert-dismissible fade show mb-3" style="border-radius:10px; border-color:#b8ddc9; background:#e8f5ef; color:var(--verde)">
        <i class="bi bi-check-circle me-2"></i>{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function mostrarToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast-check';
  t.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
