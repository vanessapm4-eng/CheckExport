<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CheckExport{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --rosa:        #c14b85;
      --rosa-mid:    #a03570;
      --rosa-dark:   #8f2f61;
      --rosa-light:  #f6dce9;
      --rosa-border: #e8b8d0;
      --amber:       #e8a020;
      --amber-light: #fef3dc;
      --bg:          #fdf7fa;
      --border:      #ead9e2;
      --text:        #2c1f27;
      --text-mid:    #5a4050;
      --text-light:  #9a7a8a;
    }
    * { font-family: 'DM Sans', sans-serif; }
    h1,h2,h3,h4,h5,h6,.navbar-brand { font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); }

    .navbar {
      background: linear-gradient(135deg, var(--rosa-dark) 0%, var(--rosa) 100%) !important;
      padding: 0.75rem 2rem;
      box-shadow: 0 2px 16px rgba(193,75,133,0.25);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.3px;
      color: white !important;
    }
    .navbar-brand span { color: #ffd6e8; }
    .nav-user {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.65);
      margin-right: 1rem;
    }
    .btn-salir {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      font-size: 0.82rem;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .btn-salir:hover { background: rgba(255,255,255,0.22); color: white; }

    .page-wrap { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .card {
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: 0 1px 6px rgba(193,75,133,0.07) !important;
    }
    .card-header {
      background: white !important;
      border-bottom: 1px solid var(--border) !important;
      border-radius: 12px 12px 0 0 !important;
    }

    .badge-rosa  { background: var(--rosa-light); color: var(--rosa-dark); font-weight: 500; border: 1px solid var(--rosa-border); }
    .badge-amber { background: var(--amber-light); color: #a06010;        font-weight: 500; border: 1px solid #f0d090; }
    .badge-rojo  { background: #fdecea;            color: #c0392b;        font-weight: 500; border: 1px solid #f5b8b2; }

    /* keep legacy verde aliases pointing to rosa so existing templates don't break */
    .badge-verde { background: var(--rosa-light); color: var(--rosa-dark); font-weight: 500; border: 1px solid var(--rosa-border); }

    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    .toast-check {
      background: linear-gradient(135deg, var(--rosa-dark), var(--rosa));
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(193,75,133,0.35);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="bi bi-flower1 me-2"></i>Check<span>Export</span>
    </a>
    <div class="ms-auto d-flex align-items-center">
      <span class="nav-user"><i class="bi bi-person-circle me-1"></i>{{ request.user.get_full_name|default:request.user.username }}</span>
      <a href="/usuarios/logout/" class="btn-salir text-decoration-none">
        <i class="bi bi-box-arrow-right me-1"></i>Salir
      </a>
    </div>
  </div>
</nav>

<div class="page-wrap">
  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-dismissible fade show mb-3" style="border-radius:10px; border-color:var(--rosa-border); background:var(--rosa-light); color:var(--rosa-dark)">
        <i class="bi bi-check-circle me-2"></i>{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function mostrarToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast-check';
  t.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
